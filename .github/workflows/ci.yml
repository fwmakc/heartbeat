name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Железные гейты: порядок строгий, первый красный — стоп.
      - run: npm ci
      - name: lint (eslint)
        run: npm run lint
      - name: typecheck (tsc --noEmit, strict)
        run: npm run typecheck
      - name: test (vitest)
        run: npm test
      - name: audit зависимостей
        run: npm audit --omit=dev --audit-level=high

  build:
    # Образ собирается ТОЛЬКО по тегу. latest на прод не катим.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
