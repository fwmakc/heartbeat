services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://heartbeat:changeit@db:5432/heartbeat
    volumes:
      # лимиты/тарифы монтируются наружу; SIGHUP (docker kill -s HUP app) перечитает конфиг
      - ./config/limits.yaml:/app/config/limits.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heartbeat
      POSTGRES_PASSWORD: changeit
      POSTGRES_DB: heartbeat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  pgdata:
